# oc76 overlay: join the Evolution API network so Evolution can POST to
# http://laschuk-resume:8787/webhook, and keep the host port on loopback only.
# Usage: docker compose -f docker-compose.yml -f docker-compose.oc76.yml up -d --build
services:
  laschuk-resume:
    ports: !override
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    networks:
      - evolution

networks:
  evolution:
    name: evolution-leonora_default
    external: true
